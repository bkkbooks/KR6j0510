body:
  text: 爾時摩醯首羅天於天上與諸天女遊戲化樂作諸伎樂忽然於髮中化出一天女容顏端正伎藝第一諸天之眾無能過者而說呪曰曩謨欝爾灑摩毘藥二合尸佉地毘也二合鉢囉二合鉢底丁以反野式伽羅者僧去林僧去林但儞也二合他濕嚩二合諾底兼跋囉麼諾哩儞吽泮吒半音持誦此呪者不問淨與不淨有妻無妻食五辛酒肉與不食常誦持者一切善願悉得成就況三業清淨人早成悉地更有何疑若有人日沒之時誦此呪一百八反即有効驗次畫像法先畫摩醯首羅天像容顏奇特端正殊妙從髮際化出一天女端正第一垂妙瓔珞兩手絡環釧左手捧天花與天王相視喜媚之容右手向下捻裙之勢於左膝上坐摩登伽天次說手印相二羽外相叉左押右成縛檀惠進力竪禪智申相合禪庾為請召真言曰唵尾跢羅娑上柅跛羅摩哩馱抳瞋馱抳瞋馱抳頻馱尼頻馱抳娑嚩二合賀若有人日日受持此印真言供養摩醯首羅天者種種得驗亦每作是印呪供養一切諸佛諸佛生歡喜兼療一切諸病有驗若誦滿一千反令婦人生歡喜若誦二千反令一切人生歡喜若誦三千反得非人愛樂誦四千反一切毘那多羅鬼皆歡喜誦五千反一切龍女生歡喜心乃至誦一萬反一切天龍藥叉五通神仙皆悉歡喜若人欲見本身者取燒死人殘柴誦呪一百八反招之即得見本身又法若能降伏怨家者取赤土畫其形書其姓名以左脚踏之誦呪一百八反不論遠近彼人自然來向所降伏又法若欲令夫婦相愛畫其形書姓名准前法踏之即相愛敬又法若欲欲得國王大臣一切諸人敬愛者准前法作之若療鬼病者取伽陀木截作二十一段呪二十一反一呪一燒病差若神病取阿魏安悉香雄黃青木香苦練葉各等分擣篩和水為丸誦呪燒之病即差若狐媚病取雄黃安悉香芎藭獨頭萩𡱝角羝羊尿白馬懸蹄驢夜等各分此八味為朱燒之薰入鼻孔及塗身上若欲成結界者以水呪七反散灑四方隨意遠近如法成結界此法中摩醯首羅者東北伊舍那天也
